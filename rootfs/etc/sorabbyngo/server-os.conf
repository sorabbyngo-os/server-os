# Sorabbyngo Server OS — Runtime Configuration
OS_VARIANT=server
OS_VERSION=1.0.0
DEPLOYMENT=datacenter

# Server role — set one
SERVER_ROLE=hospital_server  # hospital_server | byngox_prime | byngonet_hub | city_node

# Byngox Prime vLLM cluster
PRIME_ENABLED=true
PRIME_MODELS=deepseek-r1:70b,mixtral:8x22b,llama3.1:70b,meditron:70b
PRIME_VLLM_PORT=8000
PRIME_GPU_COUNT=auto

# NATS JetStream clustering
NATS_CLUSTER_ENABLED=true
NATS_CLUSTER_NAME=sorabbyngo-cluster
NATS_CLUSTER_PORT=6222

# AI tier — servers get full Tier 3/4
AI_TIER=4
BYNGOX_AGENTS=all

# Security
CML_ENABLED=true
SENTINEL_ENABLED=true
CYBERWALL_ENABLED=true
DMZ_ENABLED=true

# Data
POSTGRES_ENABLED=true
REDIS_ENABLED=true
NEO4J_ENABLED=true
LANCEDB_ENABLED=true
