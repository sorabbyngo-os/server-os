# Sorabbyngo Server OS — NATS JetStream Cluster config
server_name: $SERVER_NAME
port: 4222
http_port: 8222

jetstream {
  store_dir: /var/lib/nats/jetstream
  max_memory_store: 4GB
  max_file_store: 100GB
}

cluster {
  name: sorabbyngo-cluster
  port: 6222
  routes: [
    nats-route://node1.sorabbyngo.internal:6222
    nats-route://node2.sorabbyngo.internal:6222
    nats-route://node3.sorabbyngo.internal:6222
  ]
}

log_file: /var/log/sorabbyngo/nats.log
logtime: true
max_connections: 100000
max_payload: 8MB
write_deadline: 10s
